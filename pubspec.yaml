name: advanced_shopping_list_frontend
description: "Advanced Shopping List Cross-platform Frontend Application."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  camera: ^0.11.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  dio: ^5.9.0
  animated_quiz_widget: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  build_runner: ^2.4.13


flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
